name: Test Workflow Manual

on:
  workflow_dispatch: # Hanya berjalan saat tombol "Run workflow" diklik manual

jobs:
  tes-koneksi:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Cek GitHub Actions & Waktu Server
        run: |
          echo "✅ GitHub Actions berhasil berjalan!"
          echo "Waktu server (UTC): $(date)"

      - name: 2. Cek Kelengkapan Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "✅ GEMINI_API_KEY: Terisi" || echo "❌ GEMINI_API_KEY: Kosong"
          [ -n "$TELEGRAM_BOT_TOKEN" ] && echo "✅ TELEGRAM_BOT_TOKEN: Terisi" || echo "❌ TELEGRAM_BOT_TOKEN: Kosong"
          [ -n "$TELEGRAM_CHAT_ID" ] && echo "✅ TELEGRAM_CHAT_ID: Terisi" || echo "❌ TELEGRAM_CHAT_ID: Kosong"

      - name: 3. Tes Kirim Pesan ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="✅ Tes GitHub Actions berhasil! Bot Telegram kamu sudah tersambung."
            echo ""
            echo "✅ Pesan tes berhasil terkirim ke Telegram!"
          else
            echo "⚠️ Tes Telegram dilewati karena TELEGRAM_BOT_TOKEN atau TELEGRAM_CHAT_ID belum diisi."
          fi
