name: Test Workflow Berita Saham

on:
  workflow_dispatch: # Hanya jalan saat diklik manual

jobs:
  tes-kirim-berita:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ambil kode dari repo
        uses: actions/checkout@v4

      - name: 2. Cek Kelengkapan Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && echo "✅ GEMINI_API_KEY: Terisi" || (echo "❌ GEMINI_API_KEY: Kosong" && exit 1)
          [ -n "$TELEGRAM_BOT_TOKEN" ] && echo "✅ TELEGRAM_BOT_TOKEN: Terisi" || (echo "❌ TELEGRAM_BOT_TOKEN: Kosong" && exit 1)
          [ -n "$TELEGRAM_CHAT_ID" ] && echo "✅ TELEGRAM_CHAT_ID: Terisi" || (echo "❌ TELEGRAM_CHAT_ID: Kosong" && exit 1)

      - name: 3. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install library
        run: pip install feedparser google-genai requests

      - name: 5. Jalankan script berita saham
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python berita_saham.py
